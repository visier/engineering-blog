<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Visier semantic model as a shared context layer</title>
  <desc id="desc">Source systems and effective-dated data flow into a semantic model containing subjects, events, references, concepts, metrics, and time semantics. The shared model then serves analysts, dashboards, APIs, and AI agents.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#006f8f"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#14212b" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#f6f8fa"/>
  <text x="600" y="56" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#071a25">The semantic model is shared analytical context</text>
  <text x="600" y="88" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#657788">Business meaning is established before a human or agent writes the query</text>

  <g filter="url(#shadow)">
    <rect x="55" y="145" width="250" height="420" rx="14" fill="#ffffff" stroke="#dce5eb" stroke-width="2"/>
  </g>
  <text x="180" y="185" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#071a25">Physical data</text>
  <text x="180" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#657788">Source-specific names and shapes</text>

  <g font-family="Inter, Arial, sans-serif" font-size="17" fill="#354858">
    <rect x="88" y="252" width="184" height="58" rx="8" fill="#eef6f8" stroke="#8dbdca"/>
    <text x="180" y="287" text-anchor="middle">Core HR systems</text>
    <rect x="88" y="329" width="184" height="58" rx="8" fill="#eef6f8" stroke="#8dbdca"/>
    <text x="180" y="364" text-anchor="middle">Recruiting systems</text>
    <rect x="88" y="406" width="184" height="58" rx="8" fill="#eef6f8" stroke="#8dbdca"/>
    <text x="180" y="441" text-anchor="middle">Performance data</text>
    <rect x="88" y="483" width="184" height="58" rx="8" fill="#eef6f8" stroke="#8dbdca"/>
    <text x="180" y="509" text-anchor="middle">States, events,</text>
    <text x="180" y="530" text-anchor="middle">and corrections</text>
  </g>

  <path d="M 320 355 C 345 355, 348 355, 374 355" fill="none" stroke="#006f8f" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="385" y="125" width="430" height="460" rx="16" fill="#ffffff" stroke="#006f8f" stroke-width="3"/>
  </g>
  <rect x="385" y="125" width="430" height="74" rx="14" fill="#006f8f"/>
  <path d="M385 183 L815 183 L815 199 L385 199 Z" fill="#006f8f"/>
  <text x="600" y="167" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Visier semantic model</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="421" y="229" width="164" height="74" rx="10" fill="#e8f2fb" stroke="#6c9bc3"/>
    <text x="503" y="258" text-anchor="middle" font-size="18" font-weight="700" fill="#14212b">Subjects</text>
    <text x="503" y="282" text-anchor="middle" font-size="14" fill="#657788">identity and state</text>

    <rect x="615" y="229" width="164" height="74" rx="10" fill="#e8f2fb" stroke="#6c9bc3"/>
    <text x="697" y="258" text-anchor="middle" font-size="18" font-weight="700" fill="#14212b">Events</text>
    <text x="697" y="282" text-anchor="middle" font-size="14" fill="#657788">occurrences in time</text>

    <rect x="421" y="326" width="164" height="74" rx="10" fill="#edf6ec" stroke="#82b366"/>
    <text x="503" y="355" text-anchor="middle" font-size="18" font-weight="700" fill="#14212b">References</text>
    <text x="503" y="379" text-anchor="middle" font-size="14" fill="#657788">approved paths</text>

    <rect x="615" y="326" width="164" height="74" rx="10" fill="#edf6ec" stroke="#82b366"/>
    <text x="697" y="355" text-anchor="middle" font-size="18" font-weight="700" fill="#14212b">Dimensions</text>
    <text x="697" y="379" text-anchor="middle" font-size="14" fill="#657788">governed groupings</text>

    <rect x="421" y="423" width="164" height="74" rx="10" fill="#fff7df" stroke="#d6b656"/>
    <text x="503" y="452" text-anchor="middle" font-size="18" font-weight="700" fill="#14212b">Concepts</text>
    <text x="503" y="476" text-anchor="middle" font-size="14" fill="#657788">business populations</text>

    <rect x="615" y="423" width="164" height="74" rx="10" fill="#fff7df" stroke="#d6b656"/>
    <text x="697" y="452" text-anchor="middle" font-size="18" font-weight="700" fill="#14212b">Metrics</text>
    <text x="697" y="476" text-anchor="middle" font-size="14" fill="#657788">reusable measures</text>

    <rect x="421" y="520" width="358" height="42" rx="9" fill="#f4eefb" stroke="#9a76ba"/>
    <text x="600" y="547" text-anchor="middle" font-size="17" font-weight="700" fill="#563d6e">Time semantics and validity rules</text>
  </g>

  <path d="M 827 355 C 850 355, 854 355, 878 355" fill="none" stroke="#006f8f" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="895" y="145" width="250" height="420" rx="14" fill="#ffffff" stroke="#dce5eb" stroke-width="2"/>
  </g>
  <text x="1020" y="185" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#071a25">Consumers</text>
  <text x="1020" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#657788">One model, shared definitions</text>

  <g font-family="Inter, Arial, sans-serif" font-size="17" fill="#354858">
    <rect x="928" y="252" width="184" height="58" rx="8" fill="#f8fbfc" stroke="#8dbdca"/>
    <text x="1020" y="287" text-anchor="middle">Analysts</text>
    <rect x="928" y="329" width="184" height="58" rx="8" fill="#f8fbfc" stroke="#8dbdca"/>
    <text x="1020" y="364" text-anchor="middle">Dashboards</text>
    <rect x="928" y="406" width="184" height="58" rx="8" fill="#f8fbfc" stroke="#8dbdca"/>
    <text x="1020" y="441" text-anchor="middle">APIs</text>
    <rect x="928" y="483" width="184" height="58" rx="8" fill="#e5f4f7" stroke="#006f8f" stroke-width="2"/>
    <text x="1020" y="509" text-anchor="middle" font-weight="700" fill="#004f66">AI agents</text>
    <text x="1020" y="531" text-anchor="middle" font-size="14" fill="#657788">business-level context</text>
  </g>

  <rect x="170" y="625" width="860" height="58" rx="12" fill="#ffffff" stroke="#dce5eb" stroke-width="2"/>
  <text x="600" y="650" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#14212b">The agent queries named business objects with grain, joins, and time rules already defined.</text>
  <text x="600" y="673" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#657788">The model still has to be configured, validated, governed, and kept current.</text>
</svg>
